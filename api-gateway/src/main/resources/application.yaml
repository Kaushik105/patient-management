spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s

  cloud:
    gateway.server.webflux:
      routes:
        - id: auth-service-route
          predicates:
            - Path=/api/auth/**
          uri: ${AUTH_SERVICE_URL:http://auth-service:4005}
          filters:
            - StripPrefix=2

        - id: api-docs-auth-service
          predicates:
            - Path=/api-docs/auth
          uri: ${AUTH_SERVICE_URL:http://auth-service:4005}
          filters:
            - RewritePath=/api-docs/auth, /api-docs

        - id: patient-service-route
          predicates:
            - Path=/api/patients/**
          uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
          filters:
            - StripPrefix=1
            - AuthenticationFilter

        - id: api-docs-patient-service
          predicates:
            - Path=/api-docs/patients
          uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
          filters:
            - RewritePath=/api-docs/patients, /api-docs
server:
  port: 4003
  shutdown: graceful
